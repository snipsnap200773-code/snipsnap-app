name: Supabase Keep Alive

on:
  schedule:
    # 毎日 日本時間の午前9時（UTC 0:00）に実行
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動で実行ボタンを押せるようにする設定

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive request
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/history?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"